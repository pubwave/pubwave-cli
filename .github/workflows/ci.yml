name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"

# Never run two CI passes for the same ref at once: queue them so a publish is
# never raced (which previously caused duplicate npm provenance / 409 errors).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Single job: install + verify + (on main) publish — one `npm ci` and one build.
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # ---- Publish (only on a push to main) ----
      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 20 ships npm 10.x.
      - name: Upgrade npm for trusted publishing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm install -g npm@latest

      - name: Check if version already published
        id: check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          NAME=$(node -p "require('./package.json').name")
          LOCAL=$(node -p "require('./package.json').version")
          REMOTE=$(npm view "$NAME@$LOCAL" version 2>/dev/null || echo "")
          if [ "$REMOTE" = "$LOCAL" ]; then
            echo "Version $LOCAL already published, skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version $LOCAL detected, will publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Built above; prepack rebuilds on publish. Authenticated via OIDC (no
      # token). Tagging + GitHub Release are handled by release.yml.
      - name: Publish to npm
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.check.outputs.should_publish == 'true'
        run: npm publish --access public
